[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ws-smuggler"
version = "0.1.0"
description = "Инструмент для низкоуровневого тестирования WebSockets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lain Iwakura", email = "lain@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ws-smuggler = "src.main:main"

[project.urls]
Homepage = "https://github.com/la1n-1wakura/ws-smuggler"
Repository = "https://github.com/la1n-1wakura/ws-smuggler"
Issues = "https://github.com/la1n-1wakura/ws-smuggler/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "WebStand*", "docs*", "reports*", "config*", "dumps*", "logs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "W191", "W291", "W293", "W605", "F401", "E402"]

[tool.ruff.format]
quote-style = "double"