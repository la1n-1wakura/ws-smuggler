name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-24.04]
      fail-fast: false
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check Python compilation
      run: |
        find src -name "*.py" -exec python -m py_compile {} \;
    
    - name: Check JSON configurations
      run: |
        python -m json.tool config/default_payloads.json > /dev/null
        python -c "import jsonschema; import json; schema=json.load(open('config/payloads.schema.json')); print('Schema is valid JSON')"
    
    - name: Run linter (ruff)
      run: |
        ruff check .
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v
    
    - name: Check git diff
      run: |
        git diff --check HEAD~1 || true
    
